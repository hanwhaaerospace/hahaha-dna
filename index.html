<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선택의 순간, 한화를 만들다 — 경력사원 입문과정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#08101F;--panel:#111C33;--panel2:#1A2744;--line:#26365A;
  --flame:#F26722;--flame-soft:rgba(242,103,34,.15);--ink:#F2EEE6;--mute:#8E9AB3;--ok:#4ADE80;--no:#F87171;
  --do:#F26722;--hs:#FF7A7A;--jd:#4ADE80;--shin:#4CC9F0;--ui:#FFC845;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--deep);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
img{max-width:100%;display:block}
#app{min-height:100vh}

/* 공통 레이아웃 */
.m{max-width:480px;margin:0 auto;padding:18px 18px 130px}
.w{max-width:1180px;margin:0 auto;padding:26px 36px 80px}
.narrow{max-width:520px;margin:0 auto;padding:40px 22px 80px}
.bar{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);margin-bottom:18px}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--mute)}
.chip.hot{border-color:var(--flame);color:#FFB48A}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tchip{background:var(--flame);color:#fff;font-weight:700;border-radius:999px;padding:3px 11px;font-size:13px}
h1{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.2;margin:0 0 14px;letter-spacing:-.5px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.35;margin:0 0 12px;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:26px 0 10px}
p{margin:0 0 12px}
.sub{color:var(--mute);font-size:15.5px}
.small{font-size:14px}.mute{color:var(--mute)}
label.lb{display:block;font-size:13.5px;color:var(--mute);margin:18px 0 8px}
input,select,textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:16px;outline:none;line-height:1.5}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--flame)}
.go{width:100%;background:var(--flame);color:#fff;font-weight:700;font-size:16.5px;border-radius:14px;padding:16px;margin-top:20px}
.go:disabled{opacity:.35;cursor:not-allowed}
.ghost{width:100%;border:1.5px solid var(--line);color:var(--mute);border-radius:14px;padding:14px;font-size:15px;margin-top:10px}
.ghost:hover{border-color:var(--flame);color:var(--ink)}
.link{color:var(--mute);text-decoration:underline;font-size:13.5px;padding:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.err{color:var(--no);font-size:14px;margin-top:10px;min-height:20px}
.fixed-bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--deep) 72%,transparent);z-index:10}
.fixed-bottom .in{max-width:444px;margin:0 auto}
.fixed-bottom .go{margin-top:0}

/* 입장 */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 24px 28px;background:#0B1426;margin-bottom:18px}
.hero .years{position:absolute;inset:0;font-family:var(--serif);font-weight:900;color:rgba(242,103,34,.10);font-size:96px;line-height:.95;padding:14px 16px;pointer-events:none}
.hero>*{position:relative}

/* 장면 */
.scene{position:relative;overflow:hidden;border-radius:18px;margin:0;background:#0B1426;min-height:280px}
.scene .bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(7px) saturate(.55) brightness(.45);transform:scale(1.06)}
.scene .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,31,.15),rgba(8,16,31,.6) 58%,rgba(8,16,31,.96))}
.scene .in{position:relative;padding:30px 22px 24px}
.rtag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:rgba(242,103,34,.92);border-radius:6px;padding:2px 9px}
.year{font-family:var(--serif);font-weight:900;font-size:88px;line-height:.95;letter-spacing:-2px;margin-top:14px}
.scene h2{margin-top:10px;font-size:26px}
.who{font-size:14px;color:#C6CEDC;margin-top:4px}
.story p{font-size:16.5px;line-height:1.78}
.q{margin:20px 0 6px;padding:15px 18px;border-left:4px solid var(--flame);background:var(--flame-soft);border-radius:0 12px 12px 0;font-family:var(--serif);font-weight:700;font-size:18.5px;line-height:1.5}
figure.ph{margin:20px 0 0}
figure.ph img{width:100%;border-radius:12px;border:1px solid var(--line);filter:sepia(.12)}
figure.ph figcaption{font-size:12.5px;color:var(--mute);margin-top:7px}
.ph-empty{margin-top:20px;border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute);font-size:13.5px}

/* 선택지 */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:14px;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--panel2)}
.opt .t{font-weight:700;font-size:16.5px;line-height:1.4;display:block}
.opt .d{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.5;display:block}
.opt.on{border-color:var(--flame);background:var(--flame-soft)}
.opt.on .k{background:var(--flame);color:#fff}
.opt.team{border-color:var(--ok)}
.opt.team .k{background:var(--ok);color:#08101F}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.4);font-size:14.5px;margin-top:14px}
.banner b{color:var(--ok)}
.wait{padding:12px 14px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--mute);margin-top:14px}

/* 결과 */
.rr{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14.5px}
.rr .kk{width:22px;font-weight:700}
.rr .bar2{flex:1;height:28px;border-radius:8px;background:var(--panel);position:relative;overflow:hidden}
.rr .fill{position:absolute;inset:0 auto 0 0;background:rgba(142,154,179,.35);border-radius:8px;transition:width .7s ease}
.rr.mine .fill{background:rgba(242,103,34,.55)}
.rr .lbl{position:relative;padding:0 10px;line-height:28px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .n{width:42px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.actual{margin-top:22px;padding:20px 18px;border-radius:16px;background:var(--panel);border:1.5px solid var(--flame)}
.actual .badge{font-size:12.5px;font-weight:700;color:var(--flame)}
.actual h3{font-family:var(--serif);font-size:21px;font-weight:900;line-height:1.4;margin:6px 0 12px}
.actual p{font-size:15.5px;line-height:1.75}
.quote{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.55;margin:14px 0;padding-left:14px;border-left:3px solid var(--flame)}
.legacy{margin-top:14px;padding:14px 16px;background:var(--panel2);border-radius:12px;font-size:15px;line-height:1.65}
.legacy b{display:block;font-size:13px;color:var(--flame);margin-bottom:2px}
.gains{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gauges{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.g{display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:10px;font-size:14.5px;font-weight:600}
.g .tr{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.g .v{height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.g .num{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.talk{margin-top:18px;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);font-size:15px}
.talk b{color:var(--flame)}

/* 2부 */
.roles{display:grid;gap:8px;margin-top:12px}
.role{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 14px;background:var(--panel);border-radius:12px;font-size:14.5px}
.role .ic{font-size:20px;line-height:1.3}
.role b{color:var(--ink)}
.vpick{display:grid;gap:10px;margin-top:14px}
.vbtn{text-align:left;padding:18px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line)}
.vbtn .vn{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.2;display:block}
.vbtn .vd{font-size:14px;color:var(--mute);display:block;margin-top:4px}
.vbtn.on{border-color:var(--flame);background:var(--flame-soft)}
.pack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pc{text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:58px 1fr;gap:12px}
.pc .py{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--flame);line-height:1.2}
.pc .pt{font-weight:700;font-size:15.5px;line-height:1.4;display:block}
.pc .pb{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.55;display:block}
.pc .src{font-size:12px;color:var(--mute);opacity:.75;margin-top:6px;display:block}
.pc.on{border-color:var(--flame);background:var(--flame-soft)}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--flame)}
.picked{padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:14.5px;display:flex;gap:10px;align-items:baseline}
.picked b{font-family:var(--serif);color:var(--flame)}
.hint{font-size:13px;color:var(--mute);margin:-2px 0 8px}
.saved{font-size:12.5px;color:var(--mute);text-align:right;margin-top:6px;min-height:18px}

/* DNA 카드 */
.dc{border-radius:18px;padding:20px 18px;background:#0B1426;border:1px solid var(--line);position:relative}
.dc .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.dc .vn{font-weight:700;border-radius:999px;padding:3px 11px;color:#08101F;font-size:13px}
.dc h4{font-family:var(--serif);font-size:20px;font-weight:900;line-height:1.4;margin:12px 0 4px}
.dc dl{margin:0}
.dc dt{font-size:12.5px;color:#FFB48A;font-weight:700;margin-top:12px}
.dc dd{margin:2px 0 0;font-size:14.5px;line-height:1.62;color:#DCE3EE;white-space:pre-wrap}
.dc a{color:#9CC6FF;word-break:break-all}
.cards{display:grid;gap:12px}

.promise{margin-top:14px;padding:30px 22px;border-radius:18px;background:var(--flame);color:#fff}
.promise .w2{font-size:13px;opacity:.85}
.promise .t2{font-family:var(--serif);font-size:23px;font-weight:900;line-height:1.45;margin-top:10px}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.exs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13.5px;text-align:left}

/* 관리자 */
.adm-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.adm-top .code{font-weight:800;color:#FFB48A;letter-spacing:.5px}
.adm-grid{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:start}
.stagelist{display:flex;flex-direction:column;gap:3px;position:sticky;top:20px}
.stagelist button{text-align:left;padding:8px 12px;border-radius:9px;font-size:14px;color:var(--mute)}
.stagelist button:hover{background:var(--panel)}
.stagelist button.on{background:var(--flame);color:#fff;font-weight:700}
.stagelist .rrow{display:grid;grid-template-columns:44px repeat(3,1fr);gap:3px;align-items:center}
.stagelist .rrow span{font-family:var(--serif);font-weight:900;color:var(--flame);font-size:14px;padding-left:12px}
.stagelist .rrow button{text-align:center;padding:7px 4px;font-size:13px}
.stagelist .grp{font-size:12px;color:var(--mute);margin:12px 0 4px 12px;opacity:.8}
.ctrls{display:flex;gap:10px;margin-bottom:18px}
.ctrls .go,.ctrls .ghost{margin:0;width:auto;padding:12px 22px}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:10px 14px}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;min-width:92px}
.timer .tt.low{color:var(--no)}
.timer button{background:var(--panel2);border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:96px;text-align:left}
.tile .tn{font-weight:800;font-size:15px}
.tile .ts{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.45}
.tile .big{font-size:30px;font-weight:900;line-height:1.1;margin-top:4px}
.tile.done{border-color:var(--ok)}
.tile.done .big{color:var(--ok)}
.proj{font-size:18px}
.proj .year{font-size:120px}
.proj .story p{font-size:20px}
.proj .q{font-size:24px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}
.bigcode{font-size:88px;font-weight:900;letter-spacing:4px;color:#FFB48A;line-height:1.05;font-variant-numeric:tabular-nums}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.roster div{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.roster b{display:block;font-size:14px}
.env{font-size:12.5px;color:var(--mute);margin-top:30px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(4,8,18,.75);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.wall{columns:3 260px;column-gap:12px}
.wall div{break-inside:avoid;background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.5}
.wall small{display:block;font-family:var(--sans);font-weight:500;color:var(--mute);font-size:12.5px;margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.t th{color:var(--mute);font-weight:600;font-size:13px}

.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.rr .fill,.g .v{transition:none}}
@media (max-width:900px){.adm-grid{grid-template-columns:1fr}.stagelist{position:static;flex-direction:row;flex-wrap:wrap}.tgrid,.roster{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.w{padding:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ════════════════════════════════════════════════════════════════
   선택의 순간, 한화를 만들다 — 경력사원 입문과정 (한화 역사·핵심가치 세션)
   · 관리자 모드(PC) : 단계 진행, 조별 제출 확인, 타이머, 2부 카드 확인
   · 교육생 모드(폰)  : 세션 코드·이름·조로 입장, 조별 선택 제출, 2부 대표자 작성
   ════════════════════════════════════════════════════════════════ */

      for(const r of data||[]){ try{ o[r.id.slice(pre.length)]=JSON.parse(r.value); }catch(e){} if(r.updated_at&&(!max||r.updated_at>max)) max=r.updated_at; }
      return {o,max};
    }
    if(MODE==="claude"){ const r=await window.storage.list(pre,true); for(const k of (r?.keys||[])){ try{ const g=await window.storage.get(k,true); if(g) o[k.slice(pre.length)]=JSON.parse(g.value);}catch(e){} } return {o,max}; }
    const keys=[]; try{ if(LS){ for(let i=0;i<LS.length;i++){ const k=LS.key(i); if(k&&k.startsWith(pre)) keys.push(k);} } else { for(const k of MEM.keys()) if(k.startsWith(pre)) keys.push(k); } }catch(e){}
    for(const k of keys){ try{ o[k.slice(pre.length)]=JSON.parse(lsGet(k)); }catch(e){} } return {o,max};
  },
  async all(){ return (await DB.fetch()).o; },
  async put(f,v){
    const s=JSON.stringify(v);
    if(MODE==="sb"){ const {error}=await sb.from("kv").upsert({id:PFX()+f,value:s,updated_at:new Date().toISOString()}); if(error) console.error("[supabase put]",error.message); return; }
    if(MODE==="claude") return window.storage.set(PFX()+f,s,true);
    lsSet(PFX()+f,s);
  },
  async del(f){
    if(MODE==="sb"){ const {error}=await sb.from("kv").delete().eq("id",PFX()+f); if(error) console.error("[supabase del]",error.message); return; }
    if(MODE==="claude") return window.storage.delete(PFX()+f,true);
    lsDel(PFX()+f);
  },
  async reset(){
    if(MODE==="sb"){ const {error}=await sb.from("kv").delete().like("id",likeP()); if(error) console.error("[supabase reset]",error.message); return; }
    const d=await DB.all(); for(const f in d) await DB.del(f);
  }
};

function gaugesOf(t){ const g={shin:0,ui:0,do:0,hs:0,jd:0}; ROUNDS.forEach(r=>{ const v=tVote(t,r.id); const o=v&&r.opts.find(x=>x.k===v.opt); if(o) for(const k in o.v) g[k]+=o.v[k]; }); return g; }
function gaugeHTML(g){ return `<div class="gauges">${GAUGE.map(k=>`<div class="g"><span>${VAL[k].n}</span><div class="tr"><div class="v" data-w="${Math.min(100,g[k]/8*100)}" style="width:0;background:${col(k)}"></div></div><span class="num">${g[k]}</span></div>`).join("")}</div>`; }
function topOf(g){ const mx=Math.max(...GAUGE.map(k=>g[k])); if(mx===0) return null; return GAUGE.filter(k=>g[k]===mx); }
function animate(){ requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll("[data-w]").forEach(x=>x.style.width=x.dataset.w+"%"))); }
function counts(r){ const c={}; r.opts.forEach(o=>c[o.k]=0); for(let t=1;t<=TEAMS;t++){ const v=tVote(t,r.id); if(v&&c[v.opt]!==undefined) c[v.opt]++; } return c; }

/* ════════ 동기화 루프 ════════ */
async function start(){ clearInterval(S.tick); await sync(true); S.tick=setInterval(sync, S.admin?1500:3000); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.code) sync(); });
async function sync(force){
  if(document.hidden && !force) return;
  try{
    const full = S.admin || MODE!=="sb" || !S.maxTs || Date.now()-(S.lastFull||0)>20000 || force;
    if(full){ const r=await DB.fetch(); S.D=r.o; S.maxTs=r.max; S.lastFull=Date.now(); }
    else{
      // 최근 10초 구간을 겹쳐서 다시 받아 기기 간 시계 차이에 대비
      const since=new Date(Date.parse(S.maxTs)-10000).toISOString();
      const r=await DB.fetch(since); Object.assign(S.D,r.o); if(r.max&&r.max>S.maxTs) S.maxTs=r.max;
      if(r.o.ctrl && r.o.ctrl.epoch!==S.epoch && S.epoch!==undefined){ S.epoch=r.o.ctrl.epoch; const f=await DB.fetch(); S.D=f.o; S.maxTs=f.max; S.lastFull=Date.now(); }
    }
    S.epoch=S.D.ctrl?.epoch; S.netErr=false;
  }catch(e){ S.netErr=true; return; }
  if(!S.admin && S.me){ const mine=S.D[`p:${S.pid}`]; if(mine) S.me=mine; else if(S.pid){ await DB.put(`p:${S.pid}`,S.me); } }
  paint(force);
}
function paint(force){
  if(S.admin) return adminPaint(force);
  const sg=psig();
  const typing=document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && el.contains(document.activeElement);
  if(!force && sg===S.sig) return;
  if(!force && typing && S.sig.split("|")[0]===sg.split("|")[0]) return;
  S.sig=sg; pPaint();
}
function goHome(){ clearInterval(S.tick); lsDel("hc1_me"); lsDel("hc1_admin"); Object.assign(S,{code:"",pid:"",me:null,admin:false,D:{},sig:""}); screenHome(); }

  let extra="";
  if(st.endsWith(":reveal")) extra=JSON.stringify(ROUNDS.find(r=>r.id===rid)?counts(ROUNDS.find(r=>r.id===rid)):{});
  if(st==="p2") extra=JSON.stringify(tCard(t))+JSON.stringify(players().filter(p=>p.team===t).map(p=>[p.name,!!p.action]));

let draftTimer=null;
function bindP(){
  const q=s=>el.querySelector(s);
  q("#out")&&(q("#out").onclick=async()=>{ await DB.del(`p:${S.pid}`); goHome(); });
  el.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ const rid=ctrl().stage.split(":")[0]; S.sel[rid]=b.dataset.opt; pPaint(); S.sig=psig(); });
  q("#submit")&&(q("#submit").onclick=async()=>{
    const rid=ctrl().stage.split(":")[0]; const opt=S.sel[rid]; if(!opt) return;
    const v={opt,by:S.me.name,pid:S.pid,at:Date.now()};
    S.D[`v:${S.me.team}:${rid}`]=v; await DB.put(`v:${S.me.team}:${rid}`,v); pPaint(); S.sig=psig();
  });
  // 2부
  const saveCard=async(patch)=>{ const k=`c:${S.me.team}`; const c={...tCard(S.me.team),...patch,at:Date.now()}; S.D[k]=c; await DB.put(k,c); };
  q("#claim")&&(q("#claim").onclick=async()=>{ await saveCard({rep:{pid:S.pid,name:S.me.name}}); pPaint(); S.sig=psig(); });
  q("#takeover")&&(q("#takeover").onclick=async()=>{ if(!confirm("이제부터 내가 대표로 작성할까요? 지금까지 쓴 내용은 그대로 이어집니다.")) return; await saveCard({rep:{pid:S.pid,name:S.me.name}}); pPaint(); S.sig=psig(); });
  el.querySelectorAll("[data-news]").forEach(b=>b.onclick=()=>{ S.sel.news=b.dataset.news; pPaint(); S.sig=psig(); });
  q("#newsgo")&&(q("#newsgo").onclick=async()=>{ await saveCard({news:S.sel.news}); pPaint(); S.sig=psig(); window.scrollTo(0,0); });
  q("#renews")&&(q("#renews").onclick=async()=>{ S.sel.news=tCard(S.me.team).news; await saveCard({news:null}); pPaint(); S.sig=psig(); });
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{ const c=tCard(S.me.team); const vs=new Set(c.values||[]); vs.has(b.dataset.v)?vs.delete(b.dataset.v):vs.add(b.dataset.v); await saveCard({values:GAUGE.filter(k=>vs.has(k))}); pPaint(); S.sig=psig(); });
  el.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{
    const k=`c:${S.me.team}`; const c={...tCard(S.me.team)}; c[inp.dataset.f]=inp.value; S.D[k]=c;
    const ok=(c.values||[]).length&&(c.what||"").trim()&&(c.why||"").trim();
    q("#cardgo").disabled=!ok; const sv=q("#saved"); if(sv) sv.textContent="작성 중…";
    clearTimeout(draftTimer); draftTimer=setTimeout(async()=>{ await DB.put(k,{...S.D[k],at:Date.now()}); if(q("#saved")) q("#saved").textContent="조원들 화면에도 반영됐습니다"; S.sig=psig(); },700);
  });
  q("#cardgo")&&(q("#cardgo").onclick=async()=>{ clearTimeout(draftTimer); await saveCard({submitted:true}); pPaint(); S.sig=psig(); window.scrollTo(0,0); });
  q("#unsubmit")&&(q("#unsubmit").onclick=async()=>{ await saveCard({submitted:false}); pPaint(); S.sig=psig(); });
  el.querySelectorAll("[data-m]").forEach(inp=>inp.oninput=()=>{ S.mine={asIf:q("#m1").value, action:q("#m2").value}; const sv=q("#minesaved"); if(sv) sv.textContent="저장 전입니다 · 아래 버튼을 눌러 주세요"; });
  q("#minego")&&(q("#minego").onclick=async()=>{
    const asIf=q("#m1").value.trim(), action=q("#m2").value.trim();
    if(!action){ q("#minesaved").textContent="행동 한 줄은 꼭 적어 주세요"; return; }
    S.me={...S.me,asIf,action}; S.mine=null; await DB.put(`p:${S.pid}`,S.me); S.D[`p:${S.pid}`]=S.me; pPaint(); S.sig=psig();
  });
  // 랩업
  const act=q("#act"); if(act) act.oninput=()=>{ S.draftAct=act.value; q("#actgo").disabled=!act.value.trim(); };
  el.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ S.draftAct=b.dataset.ex; const a=q("#act"); a.value=S.draftAct; q("#actgo").disabled=false; });
  q("#actgo")&&(q("#actgo").onclick=async()=>{ S.me={...S.me,action:S.draftAct.trim()}; await DB.put(`p:${S.pid}`,S.me); S.D[`p:${S.pid}`]=S.me; pPaint(); S.sig=psig(); });
  q("#redo")&&(q("#redo").onclick=async()=>{ S.draftAct=S.me.action; S.me={...S.me,action:""}; await DB.put(`p:${S.pid}`,S.me); S.D[`p:${S.pid}`]=S.me; pPaint(); S.sig=psig(); });
}

function timerHTML(){ const T=S.timer, m=Math.floor(T.left/60), s=String(T.left%60).padStart(2,"0");
  return `<div class="timer"><span class="tt ${T.left<=30?"low":""}" id="tt">${m}:${s}</span>
    <button data-tset="180">3분</button><button data-tset="300">5분</button><button data-tset="1200">20분</button>
    <button data-tadd="-60">−1분</button><button data-tadd="60">+1분</button>
    <button id="trun" style="background:var(--flame);color:#fff">${T.run?"멈춤":"시작"}</button></div>`; }
function tickTimer(){ const tt=el.querySelector("#tt"); if(!tt) return; const T=S.timer; const m=Math.floor(Math.max(0,T.left)/60), s=String(Math.max(0,T.left)%60).padStart(2,"0"); tt.textContent=`${m}:${s}`; tt.classList.toggle("low",T.left<=30); }
function adminStage(st){

      <p class="sub">휴대폰으로 아래 주소에 접속 → <b style="color:var(--ink)">교육생으로 입장</b> → 세션 코드 · 이름 · 조 입력</p>
      <div class="card" style="text-align:center;padding:30px"><div class="mute small">세션 코드</div><div class="bigcode">${esc(S.code)}</div><div class="small mute" style="margin-top:10px;word-break:break-all">${esc(url)}</div></div></div>
      <div><h3 style="margin-top:0">조별 접속 현황</h3><div class="roster" style="grid-template-columns:repeat(2,1fr)">${Array.from({length:TEAMS},(_,i)=>{const m=ps.filter(p=>p.team===i+1);return `<div><b>${i+1}조 · ${m.length}명</b>${m.map(p=>esc(p.name)).join(", ")||"-"}</div>`}).join("")}</div></div></div>`;
  }
  if(st==="intro"){
    return `<div class="proj"><h1>선택의 순간, 한화를 만들다</h1><p class="sub" style="font-size:19px">한화의 결정적 순간 4장면. 우리 조라면 어떤 선택을 했을까요?</p>
      <div class="card" style="margin-top:20px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${["shin","ui"].map(k=>`<div style="background:var(--panel2);border-radius:12px;padding:18px"><b style="font-family:var(--serif);font-size:30px">${VAL[k].n}</b><div class="mute" style="margin-top:6px">${VAL[k].d}</div></div>`).join("")}</div>
      <p style="text-align:center;color:var(--flame);font-weight:700;margin:16px 0">한화정신을 2011년 행동 기준으로 재해석</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${CORE.map(k=>`<div style="background:var(--panel2);border-radius:12px;padding:18px"><b style="font-family:var(--serif);font-size:26px">${VAL[k].n}</b><div class="mute small" style="margin-top:6px">${VAL[k].d}</div></div>`).join("")}</div></div></div>`;
  }
  if(st.includes(":")){
    const [rid,ph]=st.split(":"); const r=ROUNDS.find(x=>x.id===rid);
    if(ph==="scene") return `<div class="proj" style="max-width:860px"><div style="margin:18px 18px 0">${sceneHTML(r)}</div><div class="story" style="margin-top:22px">${r.story.map(p=>`<p>${p}</p>`).join("")}</div><div class="q">${r.q}</div></div>`;
    if(ph==="choose"){
      const done=Array.from({length:TEAMS},(_,i)=>tVote(i+1,rid)).filter(Boolean).length;
      return `<h2>${r.year} ${r.title} — 조별 제출 현황 <span class="mute" style="font-family:var(--sans);font-size:18px">${done}/${TEAMS}</span></h2>
        <div class="tgrid">${Array.from({length:TEAMS},(_,i)=>{const t=i+1,v=tVote(t,rid),n=ps.filter(p=>p.team===t).length;return `<div class="tile ${v?"done":""}"><div class="tn">${t}조 <span class="mute" style="font-weight:500;font-size:12.5px">${n}명</span></div>${v?`<div class="big">${v.opt}</div><div class="ts">${esc(v.by)} 제출</div>`:`<div class="ts" style="margin-top:10px">토론 중</div>`}</div>`}).join("")}</div>
        <div class="card" style="margin-top:18px">${r.opts.map(o=>`<div style="display:flex;gap:12px;padding:6px 0"><b style="width:20px">${o.k}</b><span>${esc(o.t)}</span></div>`).join("")}</div>`;
    }
    if(ph==="reveal"){
      return `<div class="two"><div><h2>${TEAMS}개 조의 선택</h2>${distHTML(r,null)}
        <h3>조별 선택</h3><div class="tgrid" style="grid-template-columns:repeat(5,1fr)">${Array.from({length:TEAMS},(_,i)=>{const v=tVote(i+1,rid);return `<div class="tile ${v&&v.opt===r.actual?"done":""}" style="min-height:70px"><div class="tn">${i+1}조</div><div class="big" style="font-size:24px">${v?v.opt:"-"}</div></div>`}).join("")}</div>
        <p class="small mute" style="margin-top:8px">초록 테두리는 실제 한화와 같은 선택입니다.</p></div>
        <div>${revealBody(r)}<div class="talk"><b>함께 나눠요</b><br>${r.talk}</div></div></div>`;
    }
  }
  if(st==="dna"){
    return `<h2>조별 DNA 결과</h2><table class="t"><thead><tr><th>조</th>${GAUGE.map(k=>`<th>${VAL[k].n}</th>`).join("")}<th>가장 많이 쌓인 가치</th><th>실제와 같은 선택</th></tr></thead><tbody>
      ${Array.from({length:TEAMS},(_,i)=>{const t=i+1,g=gaugesOf(t),top=topOf(g),same=ROUNDS.filter(r=>tVote(t,r.id)?.opt===r.actual).length;return `<tr><td><b>${t}조</b></td>${GAUGE.map(k=>`<td>${g[k]}</td>`).join("")}<td>${top?top.map(k=>VAL[k].n).join("·"):"-"}</td><td>${same}/${ROUNDS.length}</td></tr>`}).join("")}</tbody></table>`;
  }
  if(st==="p2"){
    const cnt=k=>Array.from({length:TEAMS},(_,i)=>tCard(i+1).values||[]).filter(v=>v.includes(k)).length;
    const dist=GAUGE.map(k=>`${vchip(k)} <b>${cnt(k)}</b>`).join("&nbsp;&nbsp;");
    const ind=ps.filter(p=>p.action||p.asIf).sort((a,b)=>a.team-b.team);
    return `<h2>2부 조별 작성 현황</h2><p class="sub">조별로 읽은 가치: ${dist}</p>
      <div class="tgrid">${Array.from({length:TEAMS},(_,i)=>{const t=i+1,c=tCard(t),n=c.news&&newsOf(c.news),m=ps.filter(p=>p.team===t);
        const stt=c.submitted?"조 카드 제출":!c.rep?"대표 미정":!n?"기사 고르는 중":"해석 작성 중";
        return `<button class="tile ${c.submitted?"done":""}" data-open="${t}"><div class="tn">${t}조 <span class="mute" style="font-weight:500;font-size:12.5px">개인 ${m.filter(p=>p.action).length}/${m.length}</span></div>
          <div class="ts">${n?`${n.d} ${esc(n.t)}`:(c.rep?`대표 ${esc(c.rep.name)}`:"")}</div>
          <div class="ts">${(c.values||[]).map(k=>VAL[k].n).join("·")}</div><div class="ts" style="color:${c.submitted?"var(--ok)":"var(--mute)"};font-weight:600">${stt}</div></button>`}).join("")}</div>
      <p class="small mute" style="margin-top:10px">조를 누르면 조 해석과 조원 개인 작성 내용을 함께 볼 수 있습니다.</p>
      <h3>개인 작성 전체 <span class="mute" style="font-weight:500">${ps.filter(p=>p.action).length}/${ps.length}명 제출</span></h3>
      <table class="t"><thead><tr><th style="width:60px">조</th><th style="width:90px">이름</th><th>내가 이 기사 속 직원이었다면</th><th>나의 첫 100일 행동</th></tr></thead><tbody>
      ${ind.map(p=>`<tr><td>${p.team}조</td><td>${esc(p.name)}</td><td>${esc(p.asIf||"-")}</td><td>${esc(p.action||"-")}</td></tr>`).join("")||`<tr><td colspan="4" class="mute">아직 작성한 사람이 없습니다.</td></tr>`}</tbody></table>`;
  }
  if(st==="gallery"){
    const cs=submittedCards();
    return `<h2>DNA 카드 갤러리 <span class="mute" style="font-family:var(--sans);font-size:18px">${cs.length}/${TEAMS}조 제출</span></h2>
      ${cs.length?`<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${cs.map(c=>cardHTML(c,false)).join("")}</div>`:`<div class="card mute">아직 제출된 카드가 없습니다.</div>`}`;
  }
  if(st==="wrap"){
    const acts=ps.filter(p=>p.action);
    return `<h2>나의 첫 한화 DNA 행동 <span class="mute" style="font-family:var(--sans);font-size:18px">${acts.length}/${ps.length}명</span></h2>
      <div class="wall">${acts.map(p=>`<div>${esc(p.action)}<small>${p.team}조</small></div>`).join("")||`<p class="mute">아직 제출된 약속이 없습니다.</p>`}</div>`;
  }
  return "";
}
function modalHTML(){ const t=+S.modal, c=tCard(t);
  return `<div class="modal" id="modal"><div class="box">${c.rep?cardHTML({...c,team:t},true):`<div class="card">${t}조는 아직 대표 작성자를 정하지 않았습니다.</div>`}<button class="ghost" id="mclose">닫기</button></div></div>`; }
function bindA(){
  const q=s=>el.querySelector(s);
  const setStage=async id=>{ const c={...ctrl(),stage:id,at:Date.now()}; S.D.ctrl=c; await DB.put("ctrl",c); if(id.endsWith(":choose")&&!S.timer.run){ S.timer.left=180; } adminPaint(true); };
  el.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>setStage(b.dataset.stage));
  const idx=STAGES.findIndex(s=>s.id===ctrl().stage);
  q("#next")&&(q("#next").onclick=()=>STAGES[idx+1]&&setStage(STAGES[idx+1].id));
  q("#prev")&&(q("#prev").onclick=()=>STAGES[idx-1]&&setStage(STAGES[idx-1].id));
  q("#home").onclick=goHome;
  q("#reset").onclick=async()=>{ if(!confirm(`세션 ${S.code}의 모든 접속자와 제출 내용을 지웁니다. 계속할까요?`)) return; await DB.reset(); await DB.put("ctrl",{stage:"lobby",epoch:Date.now()}); await sync(true); };
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ S.modal=b.dataset.open; adminPaint(true); });
  q("#mclose")&&(q("#mclose").onclick=()=>{ S.modal=null; adminPaint(true); });
  q("#modal")&&(q("#modal").onclick=e=>{ if(e.target.id==="modal"){ S.modal=null; adminPaint(true); } });
  el.querySelectorAll("[data-tset]").forEach(b=>b.onclick=()=>{ S.timer.left=+b.dataset.tset; tickTimer(); });
  el.querySelectorAll("[data-tadd]").forEach(b=>b.onclick=()=>{ S.timer.left=Math.max(0,S.timer.left+ +b.dataset.tadd); tickTimer(); });
  q("#trun")&&(q("#trun").onclick=()=>{ const T=S.timer; T.run=!T.run; clearInterval(T.id);
    if(T.run){ T.id=setInterval(()=>{ T.left=Math.max(0,T.left-1); tickTimer(); if(T.left===0){ clearInterval(T.id); T.run=false; const b=q("#trun"); if(b) b.textContent="시작"; } },1000); }
    q("#trun").textContent=T.run?"멈춤":"시작"; });
}

/* ════════ 시작 ════════ */
(async()=>{
  await detectMode();
  try{
    const a=lsGet("hc1_admin"); if(a){ S.code=a; S.admin=true; return start(); }
    const m=JSON.parse(lsGet("hc1_me")||"null");
    if(m&&m.code&&m.pid){ S.code=m.code; S.pid=m.pid; const d=await DB.all(); const me=d[`p:${m.pid}`]; if(me){ S.me=me; return start(); } }
  }catch(e){}
  screenHome();
})();
</script>
</body>
